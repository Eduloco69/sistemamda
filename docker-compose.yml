services:

  gateway:
    build: ./api-gateway
    ports:
      - "5000:8000"
    env_file:
      - .env
    networks:
      - app-net

  auth-service:
    build: ./services/auth-service
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./shared:/shared
    networks:
      - app-net

  ticket-service:
    build: ./services/ticket-service
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./shared:/shared
    networks:
      - app-net

  message-service:
    build: ./services/message-service
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./shared:/shared
    networks:
      - app-net

  notification-service:
    build: ./services/notification-service
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./shared:/shared
    networks:
      - app-net

  frontend:
    build: ./frontend
    container_name: mda-frontend
    networks:
      - app-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
    expose:
      - "1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  sql_data: