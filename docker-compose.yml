services:

  gateway:
    build: ./api-gateway
    ports:
      - "5010:8000"
    env_file:
      - .env
    networks:
      - app-net

  auth-service:
    build: ./services/auth-service
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./shared:/shared
    networks:
      - app-net

  ticket-service:
    build: ./services/ticket-service
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./shared:/shared
      - ./logs/ticket-service:/app/logs
    networks:
      - app-net

  message-service:
    build: ./services/message-service
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./shared:/shared
    networks:
      - app-net

  notification-service:
    build: ./services/notification-service
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./shared:/shared
    networks:
      - app-net

  frontend:
    build: ./frontend
    container_name: mda-frontend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  sql_data: