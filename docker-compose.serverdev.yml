services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-net

  gateway:
    command: flask --app main:app run --host=0.0.0.0 --port=8000 --debug

  auth-service:
    command: flask --app main:app run --host=0.0.0.0 --port=5000 --debug

  ticket-service:
    command: flask --app main:app run --host=0.0.0.0 --port=5000 --debug

  message-service:
    command: flask --app main:app run --host=0.0.0.0 --port=5000 --debug

  notification-service:
    command: flask --app main:app run --host=0.0.0.0 --port=5000 --debug